<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120b36">
<meta name="format-detection" content="telephone=no">
<title>Arabian Night – A Magical Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel+Decorative:wght@400;700;900&family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap"></noscript>
<style>
:root{
  --night:#06041a; --indigo:#120b36; --purple:#2a1659; --plum:#43206f;
  --gold:#f2c14e; --gold2:#ffe9a8; --gold3:#b8862b; --teal:#c77dff; --rose:#e0457b; --cream:#fff6dd;
  --glass:rgba(48,26,98,.72); --line:rgba(242,193,78,.45);
  --disp:'Cinzel Decorative','Amiri',Georgia,serif; --ar:'Amiri',Georgia,serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#1f1148}
body{font-family:var(--body);color:var(--cream);background:#1f1148;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.10;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><g fill='none' stroke='%23f2c14e' stroke-width='1'><rect x='20' y='20' width='40' height='40'/><rect x='20' y='20' width='40' height='40' transform='rotate(45 40 40)'/><circle cx='40' cy='40' r='9'/></g></svg>");
  background-size:80px 80px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#40207a 0%,#2b1760 50%,#1f1148 100%);contain:strict}
.tw{will-change:opacity;animation:tw 4s ease-in-out infinite alternate}.tw2{animation-duration:6.5s;animation-delay:-2s}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.shoot{position:absolute;top:9%;left:72%;width:110px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;will-change:transform,opacity;animation:shoot 13s linear infinite}
.shoot.s2{top:20%;left:45%;animation-delay:-6s}
@keyframes shoot{0%{opacity:0;transform:translate3d(0,0,0) rotate(-24deg)}1.5%{opacity:1}7%{opacity:0;transform:translate3d(-340px,150px,0) rotate(-24deg)}100%{opacity:0;transform:translate3d(-340px,150px,0) rotate(-24deg)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
#moon{position:absolute;z-index:1;pointer-events:none;top:3.5vh;right:6vw;width:clamp(70px,13vw,150px);animation:floaty 9s ease-in-out infinite;will-change:transform}
#skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(110px,24vh,230px)}
.lanterns{position:absolute;top:0;left:0;right:0;height:0;z-index:1;pointer-events:none}
.lantern{position:absolute;top:0;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite;will-change:transform}
.lantern svg{display:block;width:100%;height:auto;overflow:visible}
.carpet{position:absolute;top:22vh;left:-160px;width:130px;opacity:.9;animation:fly 28s linear infinite;will-change:transform}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fly{0%{transform:translate(0,0) rotate(-4deg)}25%{transform:translate(30vw,-18px) rotate(3deg)}50%{transform:translate(65vw,10px) rotate(-3deg)}100%{transform:translate(120vw,-12px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0s!important}}

#app{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:clamp(120px,22vh,190px) 16px 150px}
body.wide #app{max-width:1100px}
body.stage #app{max-width:none;padding:0}

/* hero */
.hero{text-align:center;margin-bottom:18px}
.hero .ar{font-family:var(--ar);font-size:clamp(1.3rem,5vw,1.8rem);color:var(--gold2);opacity:.9;letter-spacing:1px}
.title{font-family:var(--disp);font-weight:900;font-size:clamp(2.1rem,9.5vw,3.4rem);line-height:1.05;letter-spacing:2px;text-transform:uppercase;isolation:isolate}
.sub{font-family:var(--disp);letter-spacing:5px;font-size:clamp(.75rem,3.3vw,1rem);margin-top:8px;text-transform:uppercase;isolation:isolate}
/* warna berubah-ubah + glow */
.gl{position:relative;display:inline-block;background:linear-gradient(90deg,#fff3c4 0%,#f2c14e 20%,#ff7eb3 40%,#a45cff 60%,#e0aaff 80%,#fff3c4 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s linear infinite}
.gl::before{content:attr(data-text);position:absolute;left:0;top:0;width:100%;z-index:-1;background:inherit;background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:blur(11px);will-change:opacity;animation:hue 8s linear infinite,pulse 2.4s ease-in-out infinite alternate}
.sub .gl{background-image:linear-gradient(90deg,#e0aaff 0%,#fff3c4 20%,#f2c14e 40%,#ff7eb3 60%,#a45cff 80%,#e0aaff 100%);animation-duration:6s;animation-direction:reverse}
.sub .gl::before{background-image:inherit;filter:blur(7px);animation:hue 6s linear infinite reverse,pulse 2s ease-in-out infinite alternate}
@keyframes hue{to{background-position:200% 50%}}
@keyframes pulse{from{opacity:.3}to{opacity:1}}
.orn{color:var(--gold);letter-spacing:10px;margin:8px 0;font-size:.95rem}
.club{font-size:.86rem;opacity:.9;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.78rem;background:rgba(48,26,98,.6)}


/* footer */
.foot{margin:26px auto 0;max-width:360px;text-align:center}
.foot .f1{font-family:var(--disp);font-weight:700;font-size:clamp(.85rem,3.6vw,1.05rem);letter-spacing:2.5px;text-transform:uppercase;margin-top:10px;background:linear-gradient(180deg,#fff,#ffe9a8 55%,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
.foot .f2{font-family:var(--ar);font-size:1.15rem;letter-spacing:5px;color:var(--teal);margin-top:2px}
/* maklumat majlis */
.org{margin:14px auto 0;max-width:460px}
.oline{display:flex;align-items:center;gap:10px;color:var(--gold)}
.oline i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.oline b{font-size:.8rem}
.org1{font-family:var(--disp);font-weight:700;font-size:clamp(1.05rem,4.6vw,1.45rem);letter-spacing:2px;text-transform:uppercase;margin:10px 0 4px;line-height:1.25;
  background:linear-gradient(180deg,#fff,#ffe9a8 60%,#f2c14e);-webkit-background-clip:text;background-clip:text;color:transparent}
.org2{font-family:var(--ar);font-style:italic;font-size:clamp(1.05rem,4.2vw,1.35rem);color:var(--teal);margin-bottom:10px;letter-spacing:.5px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px auto 0;max-width:460px}
.ib2{border:1.5px solid var(--line);border-radius:44px 44px 16px 16px;padding:14px 4px 12px;background:linear-gradient(180deg,rgba(242,193,78,.14),rgba(48,26,98,.55));text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.ib2 svg{width:26px;height:26px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:3px}
.ib2 svg .fill{fill:var(--gold)}
.ib2 small{font-size:.62rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--teal);font-weight:800}
.ib2 strong{font-family:var(--disp);font-size:clamp(.78rem,3.4vw,.98rem);color:var(--gold);letter-spacing:.5px;line-height:1.2}
.ib2 span{font-size:clamp(.68rem,3vw,.82rem);color:var(--cream);opacity:.92;line-height:1.25}
@media (min-width:700px){.org{max-width:520px}.info{max-width:520px;gap:12px}.ib2 svg{width:30px;height:30px}}

/* kad */
.card{position:relative;background:var(--glass);border:1.5px solid var(--line);border-radius:26px;padding:22px 20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 40px rgba(242,193,78,.06);margin-top:14px}
.card.arch{border-radius:150px 150px 26px 26px;padding-top:44px}
.card::after{content:"";position:absolute;inset:6px;border:1px solid rgba(242,193,78,.18);border-radius:inherit;pointer-events:none}
.card h2{font-family:var(--disp);color:var(--gold);font-size:1.15rem;text-align:center;letter-spacing:1px;margin-bottom:14px}
label{display:block;font-size:.8rem;letter-spacing:.5px;color:var(--gold2);margin:14px 0 6px;font-weight:700}
input,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--cream);background:rgba(31,17,72,.65);border:1.5px solid rgba(242,193,78,.5);border-radius:14px;padding:13px 14px;outline:none;transition:.2s}
select option{background:#14103a;color:#fff6dd}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.2)}
input::placeholder{color:rgba(255,246,221,.4)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:700;letter-spacing:1.5px;font-size:.95rem;text-transform:uppercase;color:#2a1659;background:linear-gradient(180deg,#ffe9a8,#f2c14e 55%,#d19a2b);border:0;border-radius:999px;padding:15px 26px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(242,193,78,.35);transition:.2s;text-decoration:none}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:translate3d(-160%,0,0) skewX(-20deg);animation:shine 3.4s infinite;will-change:transform}
@keyframes shine{0%,60%{transform:translate3d(-160%,0,0) skewX(-20deg)}100%{transform:translate3d(420%,0,0) skewX(-20deg)}}
.btn.block{display:flex;width:100%;margin-top:22px}
.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost::after{display:none}
.btn.sm{padding:9px 16px;font-size:.72rem}
.btn.red{background:linear-gradient(180deg,#ff8aa8,#e0457b);color:#fff}
.msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:.9rem;text-align:center}
.msg.err{background:rgba(224,69,123,.2);border:1px solid rgba(224,69,123,.6)}
.msg.ok{background:rgba(199,125,255,.18);border:1px solid rgba(199,125,255,.6)}
.small{font-size:.8rem;opacity:.75}
.center{text-align:center}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px;transition:width .6s}

/* tiket */
.ticket{text-align:center}
.ticket .hi{font-family:var(--ar);font-size:1.3rem;color:var(--gold2)}
.ticket .nm{font-weight:800;font-size:1.15rem;margin:4px 0 2px}
.ticket .un{opacity:.8;font-size:.9rem}
.ticket .lab{font-family:var(--disp);letter-spacing:3px;font-size:.72rem;color:var(--teal);margin-top:18px;text-transform:uppercase}
.bignum{font-family:var(--disp);font-weight:900;font-size:clamp(5.5rem,30vw,9rem);line-height:1.05;background:linear-gradient(180deg,#fff3c4,#f2c14e 50%,#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(242,193,78,.55));animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.dash{border-top:1px dashed var(--line);margin:18px 0}
.bignum.spinning{animation:none;opacity:.85}
#app{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
@media (min-width:700px){#app{max-width:640px}.card{padding:28px 30px 30px}.card.arch{padding-top:52px}}
@media (min-width:900px){body.split-page #app{max-width:1100px;padding-top:clamp(110px,15vh,160px)}
 .split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;min-height:62vh}
 .split .card{margin-top:0}.split .title{font-size:clamp(2.6rem,4.4vw,4.2rem)}}
@media (max-height:520px) and (orientation:landscape){#app{padding-top:90px}}

/* undi */
.cand{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid rgba(242,193,78,.25);border-radius:14px;margin-top:8px;cursor:pointer;transition:.15s;background:rgba(8,5,30,.45)}
.cand:hover{border-color:var(--gold)}
.cand input{display:none}
.cand .badge{min-width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;color:#2a1659;background:linear-gradient(180deg,#ffe9a8,#f2c14e)}
.cand .t b{display:block;font-size:.95rem}
.cand .t span{font-size:.78rem;opacity:.75}
.cand.sel{border-color:var(--gold);background:rgba(242,193,78,.18);box-shadow:0 0 0 2px rgba(242,193,78,.4)}
.cand.sel::after{content:"✓";margin-left:auto;color:var(--gold);font-weight:900;font-size:1.3rem}
.clist{max-height:340px;overflow:auto;padding-right:4px}

/* poster */
.posters{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:760px){.posters{grid-template-columns:1fr 1fr}}
.qrcard{text-align:center}
.qrbox{display:inline-block;background:#fff6dd;padding:14px;border-radius:18px;border:4px solid var(--gold);margin:8px 0 10px;box-shadow:0 0 30px rgba(242,193,78,.4)}
.qrbox img,.qrbox canvas{display:block}
.qrurl{font-size:.7rem;opacity:.6;word-break:break-all}
@media print{
  #bg canvas,.noprint{display:none!important}
  body{background:#120b36!important}
  #app{padding-top:20px}
}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;background:rgba(8,5,30,.55)}
.tile b{display:block;font-family:var(--disp);font-size:1.9rem;color:var(--gold)}
.tile span{font-size:.75rem;opacity:.8}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-family:var(--disp);font-size:.7rem;letter-spacing:1px;color:var(--teal);text-align:left;padding:8px 6px;text-transform:uppercase}
td{padding:8px 6px;border-top:1px solid rgba(242,193,78,.15);vertical-align:middle}
td select{padding:6px 8px;font-size:.8rem;border-radius:10px}
.scroll{overflow:auto;max-height:520px}
.ubar{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center;font-size:.8rem;margin:5px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;gap:14px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 6px}
.demo{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--rose);color:#fff;text-align:center;font-size:.72rem;padding:4px 8px;font-weight:700;letter-spacing:.5px}

/* pentas cabutan */
.stage-wrap{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 16px 24px}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;z-index:5}
.topbar .brand{font-family:var(--disp);font-weight:700;color:var(--gold);letter-spacing:2px;font-size:.9rem}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{font-size:.72rem;padding:5px 11px;border-radius:999px;border:1px solid var(--line);opacity:.55;font-weight:700;letter-spacing:.5px}
.pill.cur{opacity:1;background:var(--gold);color:#2a1659;box-shadow:0 0 16px rgba(242,193,78,.6)}
.pill.done{opacity:.9;border-color:var(--teal);color:var(--teal)}
.tools{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(8,5,30,.6);color:var(--gold);cursor:pointer;font-size:1rem;display:grid;place-items:center}
.ib:hover{background:rgba(242,193,78,.2)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding-top:10px}
.sesi{font-family:var(--disp);letter-spacing:5px;color:var(--teal);font-size:clamp(.8rem,2.4vw,1.2rem);text-transform:uppercase}
.cabno{font-family:var(--disp);font-size:clamp(1rem,3.2vw,1.8rem);color:var(--gold2);letter-spacing:6px}
.cabno b{font-size:clamp(2.2rem,min(8vw,9vh),5rem);color:var(--gold);display:block;line-height:1;text-shadow:0 0 30px rgba(242,193,78,.6)}
.prize{font-family:var(--ar);font-size:clamp(1.1rem,3vw,1.9rem);min-height:1.6em;color:var(--cream)}
.reelwrap{margin:10px 0;padding:14px 38px 6px;border-radius:200px 200px 22px 22px;border:3px solid var(--gold);background:linear-gradient(180deg,rgba(20,12,56,.9),rgba(6,4,26,.95));box-shadow:0 0 60px rgba(242,193,78,.35),inset 0 0 50px rgba(242,193,78,.12)}
.reel{font-family:var(--disp);font-weight:900;font-size:clamp(5rem,min(24vw,27vh),14rem);line-height:1.05;min-width:2ch;color:var(--gold);text-shadow:0 0 40px rgba(242,193,78,.8);font-variant-numeric:tabular-nums}
.reel.spin{opacity:.92}
.reel.land{animation:land .7s ease-out}
@keyframes land{0%{transform:scale(1.5)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.winner{min-height:100px;opacity:0;transform:translateY(24px);transition:.6s}
.winner.show{opacity:1;transform:none}
.winner .wn{font-family:var(--disp);font-weight:700;font-size:clamp(1.3rem,4.4vw,2.8rem);color:#fff;text-shadow:0 0 22px rgba(199,125,255,.9)}
.winner .wu{font-size:clamp(.95rem,2.2vw,1.4rem);color:var(--teal);margin-top:4px}
.winner .wp{font-family:var(--ar);font-size:clamp(1.1rem,2.6vw,1.7rem);color:var(--gold2);margin-top:6px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.go{font-size:clamp(1rem,2.4vw,1.4rem)!important;padding:18px 40px!important}
.note{margin-top:10px;font-family:var(--ar);font-size:1.2rem;color:var(--gold2)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:60;background:rgba(10,6,34,.96);border-left:2px solid var(--gold);padding:18px;overflow:auto;transform:translateX(105%);transition:.35s}
.drawer.open{transform:none}
.wl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(242,193,78,.18);font-size:.86rem}
.wl .c{font-family:var(--disp);color:var(--gold);min-width:36px;font-weight:700}
.wl .n{font-weight:800;color:var(--teal);min-width:34px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(3,2,16,.8);display:grid;place-items:center;padding:16px}
.modal .box{background:#120b36;border:2px solid var(--gold);border-radius:22px;padding:22px;max-width:620px;width:100%;max-height:92vh;overflow:auto}
.srow{display:grid;grid-template-columns:1.4fr .7fr .7fr auto;gap:8px;margin-top:8px}
.srow input{padding:9px 10px;font-size:.9rem}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.crown{font-size:clamp(3.5rem,12vw,7rem);animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 0 25px rgba(242,193,78,.8))}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;max-width:560px;margin:14px auto 0}
.podium>div{border:1px solid var(--line);border-radius:14px 14px 0 0;padding:10px 6px;background:rgba(8,5,30,.6);font-size:.82rem}
.podium .v{font-family:var(--disp);color:var(--gold);font-size:1.2rem}
.hide{display:none!important}
</style>
</head>
<body>
<div id="bg">

      if (!pool.length) return err('Tiada lagi peserta layak. Semak bilangan peserta berdaftar atau ubah jumlah cabutan.', 'kosong');
      var w = pool[Math.floor(env.random() * pool.length)];
      var rec = { cabutan: nx, no: w.no, nama: w.nama, unit: w.unit, masa: env.now(), absent: false };
      store.cabutan.push(rec);
      return { ok: true, winner: rec, next: nextCabutan(store), sisa: pool.length - 1, _dirty: ['cabutan'] };
    }

    case 'undoDraw': {
      if (!store.cabutan.length) return err('Tiada cabutan untuk dibatalkan.');
      var last = store.cabutan.pop();
      return { ok: true, removed: last, next: nextCabutan(store), _dirty: ['cabutan'] };
    }

    case 'absentDraw': {
      if (!store.cabutan.length) return err('Tiada cabutan.');
      var l2 = store.cabutan[store.cabutan.length - 1];
      l2.absent = true;
      return { ok: true, absent: l2, next: nextCabutan(store), _dirty: ['cabutan'] };
    }

    case 'voteInfo':
      return {
        ok: true, voteOpen: !!cfg.voteOpen,
        raja: cfg.voteOpen ? candidatesOf(store, 'raja') : [],
        permaisuri: cfg.voteOpen ? candidatesOf(store, 'permaisuri') : []
      };

    case 'vote': {
      if (!cfg.voteOpen) return err('Undian belum dibuka atau telah ditutup.', 'tutup');
      var vn = toInt(req.voterNo, 0);
      var voter = store.peserta.filter(function (p) { return p.no === vn && norm(p.nama) === norm(req.voterNama); })[0];
      if (!voter) return err('No. bertuah dan nama tidak sepadan dengan rekod pendaftaran.');
      if (store.undi.some(function (u) { return u.voterNo === vn; })) return err('Anda telah mengundi. Terima kasih!', 'dup');
      var r = toInt(req.raja, 0), q = toInt(req.permaisuri, 0);
      if (!r && !q) return err('Sila pilih sekurang-kurangnya satu calon.');
      if (r) {
        if (r === vn) return err('Tidak boleh mengundi diri sendiri.');
        if (!candidatesOf(store, 'raja').some(function (c) { return c.no === r; })) return err('Calon Raja tidak sah.');
      }
      if (q) {
        if (q === vn) return err('Tidak boleh mengundi diri sendiri.');
        if (!candidatesOf(store, 'permaisuri').some(function (c) { return c.no === q; })) return err('Calon Permaisuri tidak sah.');
      }
      var urec = { masa: env.now(), voterNo: vn, voterNama: voter.nama, raja: r, permaisuri: q };
      store.undi.push(urec);
      return { ok: true, _dirty: ['undi'], _added: { undi: urec } };
    }

    case 'results': {
      function tally(cat, field) {
        var cnt = {};
        store.undi.forEach(function (u) { if (u[field]) cnt[u[field]] = (cnt[u[field]] || 0) + 1; });
        return candidatesOf(store, cat).map(function (c) { c.undi = cnt[c.no] || 0; return c; })
          .sort(function (x, y) { return y.undi - x.undi || x.no - y.no; });
      }
      return { ok: true, voteOpen: !!cfg.voteOpen, pengundi: store.undi.length, raja: tally('raja', 'raja'), permaisuri: tally('permaisuri', 'permaisuri') };
    }

    case 'reset': {
      var what = req.what;
      if (what === 'cabutan') { store.cabutan = []; return { ok: true, _dirty: ['cabutan'] }; }
      if (what === 'undi') { store.undi = []; return { ok: true, _dirty: ['undi'] }; }
      if (what === 'semua') {
        store.peserta = []; store.cabutan = []; store.undi = []; store.config.voteOpen = false;
        return { ok: true, _dirty: ['peserta', 'cabutan', 'undi', 'config'] };
      }
      return err('Pilihan tidak sah.');
    }
  }
  return err('Tindakan tidak dikenali: ' + a);
}

const FX = (() => {
  let cv, ctx, parts = [], run = false;
  function init() { if (cv) return; cv = document.createElement('canvas'); cv.id = 'fx'; document.body.appendChild(cv); ctx = cv.getContext('2d'); const rs = () => { cv.width = innerWidth; cv.height = innerHeight; }; rs(); addEventListener('resize', rs); }
  const cols = ['#f2c14e', '#ffe9a8', '#c77dff', '#e0457b', '#a45cff', '#fff'];
  function burst(x, y, n, power) {
    init();
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (Math.random() * .6 + .4) * power; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * .35, g: .18, life: 90 + Math.random() * 60, c: cols[i % cols.length], w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4 }); }
    if (!run) { run = true; loop(); }
  }
  function loop() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 30);
    parts.forEach(p => { p.vy += p.g; p.vx *= .992; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--; ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 40); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (parts.length) requestAnimationFrame(loop); else { run = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }
  return {
    burst,
    big() { init(); const W = innerWidth, H = innerHeight; for (let i = 0; i < 9; i++) setTimeout(() => burst(W * (.1 + Math.random() * .8), H * (.15 + Math.random() * .4), 70, 9), i * 260); },
    rain() { init(); for (let i = 0; i < 90; i++) setTimeout(() => burst(Math.random() * innerWidth, -10, 2, 2), i * 30); }
  };
})();

const Snd = (() => {
  let ctx, master, musicOn = false, timer = null, tnext = 0, step = 0, drone = [], idx = 3, file = null, noiseBuf;

  }

    while (tnext < ctx.currentTime + .45) {
      const p = step % 16;
      if (p === 0 || p === 8 || p === 10) drum(tnext, 'dum'); else if (p === 4 || p === 6 || p === 12 || p === 14 || p === 15) drum(tnext, 'tek');
      if (step % 2 === 0 || Math.random() < .35) { idx += [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]; if (idx < 4) idx = 5; if (idx > 13) idx = 11; pluck(tnext, HIJ[idx], .14); }

    preload() {

    },
    unlockSfx() {

    SS.del('pin'); SS.set('pinbad', '1');

  }
}
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

async function pgDaftar() {
  document.body.classList.add('split-page');

  }
  function ticket(r, again) {
    const no = String(r.no).padStart(2, '0');

    $('#mf', m).onchange = e => { if (e.target.files[0]) Snd.setFile(e.target.files[0]); };
    $('#sv', m).onclick = async () => {
      const sessions = [...$('#ss', m).children].map(r => ({ nama: r.querySelector('.a').value, dari: r.querySelector('.b').value, hingga: r.querySelector('.c').value }));
      const prizes = {}; $('#pz', m).value.split('\n').forEach(l => { const i = l.indexOf('='); if (i > 0) { const k = l.slice(0, i).trim(), v = l.slice(i + 1).trim(); if (k && v) prizes[k] = v; } });
      const r = await api('setConfig', { config: { total: $('#tt', m).value, sessions, prizes } });
      if (!r.ok) return $('#sm', m).innerHTML = `<div class="msg err">${esc(r.error)}</div>`;
      await reload(); paint(); m.remove();
    };
  }
  $('#bl').onclick = () => { showList(); $('#drawer').classList.toggle('open'); };
  $('#bs').onclick = settings;
  $('#bm').onclick = () => { const on = Snd.toggle(); $('#bm').style.background = on ? 'rgba(242,193,78,.35)' : ''; };
  $('#bf').onclick = () => { const e = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (e.requestFullscreen) e.requestFullscreen().catch(() => { }); };

  async function draw() {
    if (busy || !S.next) return; busy = true; Snd.unlock(); Snd.unlockSfx(); paint();
    const sfxKey = n => n === 3 ? 'p3' : n === 2 ? 'p2' : n === 1 ? 'p1' : 'menang';
    if (S.next === 3) Snd.sfx('grand', true);
    $('#go').disabled = true; $('#after').innerHTML = ''; $('#note').textContent = '';
    const w = $('#winner'); w.classList.remove('show');
    reel.classList.remove('land'); reel.classList.add('spin');
    const pool = S.pool.length ? S.pool : [1]; const rnd = () => pool[Math.floor(Math.random() * pool.length)];
    let spinning = true; const spinT = setInterval(() => { if (spinning) { reel.textContent = pad(rnd()); Snd.tick(); } }, 70);
    const t0 = Date.now(), res = await api('draw');
    await sleep(Math.max(0, 2600 - (Date.now() - t0)));
    spinning = false; clearInterval(spinT);
    if (!res.ok) { reel.classList.remove('spin'); $('#go').disabled = false; busy = false; $('#note').innerHTML = `<span style="color:#ff8aa8">${esc(res.error)}</span>`; await reload(); paint(); return; }
    // perlahan sebelum berhenti
    const delays = [90, 110, 135, 165, 200, 250, 310, 380, 470]; let last = -1;
    for (const dl of delays) { let x; do { x = rnd(); } while (x === last && pool.length > 1); last = x; reel.textContent = pad(x); Snd.tick(); await sleep(dl); }
    reel.textContent = pad(res.winner.no); reel.classList.remove('spin'); reel.classList.add('land');
    const big = res.winner.cabutan <= 3; Snd.sfx(sfxKey(res.winner.cabutan), big);
    w.innerHTML = `<div class="wn">${esc(res.winner.nama)}</div><div class="wu">${esc(res.winner.unit)}</div>${prizeOf(res.winner.cabutan) ? `<div class="wp">🎁 ${esc(prizeOf(res.winner.cabutan))}</div>` : ''}`;
    w.classList.add('show'); big ? FX.big() : FX.burst(innerWidth / 2, innerHeight * .4, 140, 11);
    await reload();
    const ses = sessOf(res.winner.cabutan);
    if (!S.next) { $('#note').textContent = '✦ Semua cabutan selesai — tahniah kepada semua pemenang! ✦'; setTimeout(() => FX.rain(), 1500); }
    else if (ses && res.winner.cabutan === ses.hingga) { const ns = sessOf(S.next); $('#note').textContent = `✦ ${ses.nama} tamat${ns ? ' — seterusnya: ' + ns.nama : ''} ✦`; }
    $('#after').innerHTML = `<button class="btn ghost sm" id="ab">Tidak hadir — cabut semula</button><button class="btn ghost sm" id="un">Batalkan cabutan ini</button>`;
    $('#ab').onclick = async () => { if (!confirm('Tandakan pemenang ini TIDAK HADIR dan cabut semula nombor yang sama?')) return; const r = await api('absentDraw'); if (!r.ok) return alert(r.error); await reload(); w.classList.remove('show'); $('#after').innerHTML = ''; $('#note').textContent = ''; reel.textContent = '--'; paint(); };
    $('#un').onclick = async () => { if (!confirm('Batalkan cabutan terakhir? Peserta kembali ke senarai layak.')) return; const r = await api('undoDraw'); if (!r.ok) return alert(r.error); await reload(); w.classList.remove('show'); $('#after').innerHTML = ''; $('#note').textContent = ''; reel.textContent = '--'; paint(); };
    paint(true); $('#go').disabled = false; busy = false;
  }
  $('#go').onclick = draw;
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !document.querySelector('.modal') && !['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(document.activeElement.tagName)) { e.preventDefault(); draw(); } });
  paint();
}

/* ============ HALAMAN: BEST DRESS (PENTAS) ============ */
async function pgBest() {
  document.body.classList.add('wide'); buildBg(false);
  let d = await needAdmin(); buildBg(false);
  let R = await api('results'), revealed = { raja: false, permaisuri: false };
  async function load() { const r = await api('results'); if (r.ok) R = r; const a = await api('adminList'); if (a.ok) d = a; }
  function top3(list, key) {
    const t = list.slice(0, 3); const max = Math.max(1, ...list.map(c => c.undi));
    return `<div class="podium">${t.map((c, i) => `<div><div class="v">${c.undi} undi</div><b>${esc(c.nama)}</b><br><span class="small">No. ${String(c.no).padStart(2, '0')} · ${esc(c.unit)}</span></div>`).join('')}</div>`;
  }
  function block(key, title, icon) {
    const list = R[key], max = Math.max(1, ...list.map(c => c.undi)), win = list[0], tie = list.length > 1 && list[1].undi === win.undi;
    return `<section class="card center"><h2>${title}</h2>
    ${revealed[key] ? (win && win.undi > 0 ? `<div class="crown">${icon}</div><div class="bignum" style="font-size:clamp(3rem,12vw,5rem)">${String(win.no).padStart(2, '0')}</div><div style="font-family:var(--disp);font-size:1.6rem;margin-top:6px">${esc(win.nama)}</div><div class="small">${esc(win.unit)} — ${win.undi} undi</div>${tie ? '<div class="msg err">Seri! Sila tentukan pemenang secara manual atau ulang undian.</div>' : ''}${top3(list, key)}` : '<div class="msg err">Belum ada undi.</div>') :
      `<div class="crown" style="filter:grayscale(1) brightness(.5)">${icon}</div><button class="btn" data-rev="${key}">✦ Umumkan Pemenang ✦</button>`}
    <div style="text-align:left;margin-top:18px">${list.slice(0, 8).map(c => `<div class="ubar" style="grid-template-columns:150px 1fr 28px"><span>${String(c.no).padStart(2, '0')} · ${esc(c.nama.split(' ').slice(0, 3).join(' '))}</span><div class="bar" style="margin:0"><i style="width:${c.undi / max * 100}%"></i></div><b>${c.undi}</b></div>`).join('')}</div></section>`;
  }
  function draw() {
    app.innerHTML = `${hero()}${navLinks('bestdress')}<div class="card"><div class="row" style="justify-content:space-between"><div>Undian: <b>${R.voteOpen ? 'DIBUKA' : 'DITUTUP'}</b> · Jumlah pengundi: <b>${R.pengundi}</b></div><div class="row"><button class="btn sm" id="tv">${R.voteOpen ? '■ Tutup Undian' : '▶ Buka Undian'}</button><button class="btn ghost sm" id="rf">↻ Muat semula</button></div></div></div>
    <div class="grid2">${block('permaisuri', 'Permaisuri Malam · Queen of the Night', '👑')}${block('raja', 'Raja Malam · King of the Night', '🤴')}</div>`;
    $('#tv').onclick = async () => { await api('setConfig', { config: { voteOpen: !R.voteOpen } }); await load(); draw(); };
    $('#rf').onclick = async () => { await load(); draw(); };
    document.querySelectorAll('[data-rev]').forEach(b => b.onclick = async () => { await load(); revealed[b.dataset.rev] = true; Snd.unlock(); Snd.fanfare(true); draw(); FX.big(); });
  }
  draw();
}

/* ============ ROUTER ============ */
const PAGE = (new URLSearchParams(location.search).get('page') || 'daftar').toLowerCase();
const ROUTES = { daftar: pgDaftar, undi: pgUndi, poster: pgPoster, dashboard: pgDashboard, admin: pgDashboard, cabutan: pgCabutan, draw: pgCabutan, bestdress: pgBest };
demoBanner();
(ROUTES[PAGE] || pgDaftar)().catch(e => { console.error(e); app.innerHTML = `<section class="card"><h2>Ralat</h2><p>${esc(e.message || e)}</p></section>`; });
</script>
